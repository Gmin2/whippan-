# local postgres for development. production uses azure database for postgres,
# so nothing here ships; it exists so `docker compose up -d` is the whole setup.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: whippan
      POSTGRES_PASSWORD: whippan
      POSTGRES_DB: whippan
    # 5433 so it never fights a postgres already running on the host
    ports: ['5433:5432']
    volumes: ['whippan-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U whippan']
      interval: 5s
      timeout: 3s
      retries: 10
  # microsoft's own azure storage emulator. the blob and queue code we ship runs
  # against this locally, so the azure implementation is exercised for real
  # rather than written blind and first tried in production.
  blob:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck
    ports: ['10000:10000', '10001:10001']
    volumes: ['whippan-blob:/data']

volumes:
  whippan-pg:
  whippan-blob:
